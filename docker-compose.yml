services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=sistema_familiar_db
      - POSTGRES_USER=sistema_familiar_user
      - POSTGRES_PASSWORD=SuaSenhaSeguraParaDB2024!@#
    ports:
      - "5440:5432"
    networks:
      - sistema-familiar-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sistema_familiar_user -d sistema_familiar_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=maintenance_project.settings_prod
      - POSTGRES_DB=sistema_familiar_db
      - POSTGRES_USER=sistema_familiar_user
      - POSTGRES_PASSWORD=SuaSenhaSeguraParaDB2024!@#
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=django-insecure-dev-key
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sistema-familiar-net
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  sistema-familiar-net:
    driver: bridge 