openapi: 3.0.3
info:
  title: Sistema Familiar API
  version: 1.0.0
  description: 'API REST do Sistema Familiar (saude familiar e manutencao). Autentique
    com Token: POST /api/auth/token/ com username e password, depois envie o header
    Authorization: Token <chave>.'
paths:
  /api/appointments/:
    get:
      operationId: api_appointments_list
      summary: Listar consultas
      parameters:
      - in: query
        name: family_member
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: specialty
        schema:
          type: string
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMedicalAppointmentList'
          description: ''
    post:
      operationId: api_appointments_create
      summary: Criar consulta
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicalAppointment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MedicalAppointment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MedicalAppointment'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalAppointment'
          description: ''
  /api/appointments/{id}/:
    get:
      operationId: api_appointments_retrieve
      summary: Detalhe da consulta
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Consulta Médica.
        required: true
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalAppointment'
          description: ''
    put:
      operationId: api_appointments_update
      summary: Atualizar consulta
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Consulta Médica.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicalAppointment'
          application/x-www-form-urlencoded:
            schema:
