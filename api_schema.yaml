        description: A search term.
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
          nullable: true
          title: Tipo
          enum:
          - eletrodomestico
          - eletronico
          - movel
          - outro
          - veiculo
        description: |-
          * `eletronico` - Eletrônico
          * `eletrodomestico` - Eletrodoméstico
          * `movel` - Móvel
          * `veiculo` - Veículo
          * `outro` - Outro
