components:
  schemas:
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          title: Nome do usuário
        password:
          type: string
          writeOnly: true
          title: Senha
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    BlankEnum:
      enum:
      - ''
    Equipment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nome
          maxLength: 100
        type:
          nullable: true
          title: Tipo
          oneOf:
          - $ref: '#/components/schemas/TypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        brand:
          type: string
          nullable: true
          title: Marca
          maxLength: 100
        model:
          type: string
          nullable: true
          title: Modelo
          maxLength: 100
        serial_number:
          type: string
          nullable: true
          title: Número de Série
          maxLength: 100
        purchase_date:
          type: string
          format: date
          nullable: true
          title: Data de Compra
        owner:
          type: integer
          nullable: true
          title: Proprietário
        owner_username:
          type: string
          readOnly: true
          nullable: true
        notes:
          type: string
          title: Observações
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentAttachment'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Data de Criação
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Data de Atualização
      required:
      - attachments
      - created_at
      - id
      - name
      - owner_username
      - updated_at
    EquipmentAttachment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        equipment:
          type: integer
          title: Equipamento
        file:
          type: string
          format: uri
          title: Arquivo
          pattern: (?:pdf|doc|docx|jpg|jpeg|png|gif)$
        description:
          type: string
          title: Descrição
          maxLength: 255
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
          title: Data de Upload
        uploaded_by:
          type: integer
          readOnly: true
          nullable: true
          title: Upload por
      required:
      - equipment
      - file
      - id
      - uploaded_at
      - uploaded_by
    FamilyMember:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          nullable: true
          title: Usuário
        name:
          type: string
          title: Nome
          maxLength: 100
        photo:
          type: string
          format: uri
          nullable: true
          title: Foto
        birth_date:
          type: string
          format: date
          title: Data de Nascimento
        gender:
          nullable: true
          title: Gênero
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        relationship:
          type: string
          nullable: true
          title: Parentesco
          maxLength: 50
        blood_type:
          type: string
          title: Tipo Sanguíneo
          maxLength: 5
        allergies:
          type: string
          title: Alergias
        chronic_conditions:
          type: string
          title: Condições Crônicas
        emergency_contact:
          type: string
          nullable: true
          title: Contato de Emergência
          maxLength: 100
        emergency_phone:
          type: string
          nullable: true
          title: Telefone de Emergência
          maxLength: 20
        notes:
          type: string
          title: Observações
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Criado em
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Atualizado em
      required:
      - birth_date
      - created_at
      - id
      - name
      - updated_at
    FrequencyEnum:
      enum:
      - once
      - twice
      - three_times
      - four_times
      - every_12h
      - every_8h
      - every_6h
      - every_4h
      - as_needed
      type: string
      description: |-
        * `once` - Uma vez ao dia
        * `twice` - Duas vezes ao dia
        * `three_times` - Três vezes ao dia
        * `four_times` - Quatro vezes ao dia
        * `every_12h` - A cada 12 horas
        * `every_8h` - A cada 8 horas
        * `every_6h` - A cada 6 horas
        * `every_4h` - A cada 4 horas
        * `as_needed` - Conforme necessário
    GenderEnum:
      enum:
      - M
      - F
      - O
      type: string
      description: |-
        * `M` - Masculino
        * `F` - Feminino
        * `O` - Outro
    MaintenanceImage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        order:
          type: integer
        image:
          type: string
          format: uri
          title: Imagem
        description:
          type: string
          title: Descrição
          maxLength: 200
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
          title: Data de Upload
      required:
      - id
      - image
      - order
      - uploaded_at
    MaintenanceOrder:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        equipment:
          type: integer
          title: Equipamento
        equipment_name:
          type: string
          readOnly: true
        title:
          type: string
          title: Título
          maxLength: 200
        description:
          type: string
          title: Descrição
        status:
          $ref: '#/components/schemas/StatusEnum'
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          title: Prioridade
        service_provider:
          type: string
          title: Empresa Prestadora do Serviço
          maxLength: 200
        completion_date:
          type: string
          format: date
          nullable: true
          title: Data da Manutenção
        cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          title: Custo
        warranty_expiration:
          type: string
          format: date
          nullable: true
          title: Data de Vencimento da Garantia
        warranty_terms:
          type: string
          title: Termos da Garantia
        invoice_number:
          type: string
          title: Número da Nota Fiscal
          maxLength: 50
        invoice_file:
          type: string
          format: uri
          nullable: true
          title: Nota Fiscal (PDF/Imagem)
        notes:
          type: string
          title: Observações
        created_by:
          type: integer
          readOnly: true
          title: Criado por
        created_by_username:
          type: string
          readOnly: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceImage'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Data de Criação
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Última Atualização
      required:
      - created_at
      - created_by
      - created_by_username
      - description
      - equipment
      - equipment_name
      - id
      - images
      - title
      - updated_at
    MedicalAppointment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        family_member:
          type: integer
          title: Membro da Família
        family_member_name:
          type: string
          readOnly: true
        doctor_name:
          type: string
          title: Nome do Médico
          maxLength: 100
        specialty:
          type: string
          title: Especialidade
          maxLength: 100
        appointment_date:
          type: string
          format: date-time
          title: Data da Consulta
        location:
