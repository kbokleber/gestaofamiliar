        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalAppointment'
          description: ''
    patch:
      operationId: api_appointments_partial_update
      summary: Atualizar parcialmente consulta
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Consulta Médica.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMedicalAppointment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMedicalAppointment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMedicalAppointment'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalAppointment'
          description: ''
    delete:
      operationId: api_appointments_destroy
      summary: Excluir consulta
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Consulta Médica.
        required: true
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/token/:
    post:
      operationId: api_auth_token_create
