# Compose com PostgreSQL incluído
# Obrigatório: POSTGRES_PASSWORD e SECRET_KEY

services:
  postgres:
    image: postgres:15-alpine
    container_name: sistema-familiar-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-sistema_familiar_db}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -q"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sistema-familiar-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-sistema_familiar_db}
      SECRET_KEY: ${SECRET_KEY:-}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      TZ: America/Sao_Paulo
      KEYCLOAK_URL: ${KEYCLOAK_URL:-https://auth.kbosolucoes.com.br}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-família}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-https://auth.kbosolucoes.com.br/realms/fam%C3%ADlia}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-gestaofamiliar}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-gestaofamiliar}
      AUTH_KEYCLOAK_ENABLED: ${AUTH_KEYCLOAK_ENABLED:-true}
      AUTH_LEGACY_PASSWORD_ENABLED: ${AUTH_LEGACY_PASSWORD_ENABLED:-true}
      KEYCLOAK_ALLOW_SIGNUP: ${KEYCLOAK_ALLOW_SIGNUP:-false}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-https://auth.kbosolucoes.com.br}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-família}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-gestaofamiliar}
    container_name: sistema-familiar-frontend
    environment:
      TZ: America/Sao_Paulo
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
